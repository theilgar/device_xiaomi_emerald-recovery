name: Build OrangeFox Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - fox_12.1
      - main

env:
  DEVICE: emerald
  BRAND: xiaomi
  FOX_BRANCH: fox_12.1

jobs:
  build:
    name: Build OrangeFox for ${{ env.DEVICE }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: device/${{ env.BRAND }}/${{ env.DEVICE }}

      - name: Cleanup Host Disk Space
        run: |
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/lib/jvm /opt/ghc
          sudo rm -rf /usr/local/share/boost /usr/local/share/powershell
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg \
            gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 \
            libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3 openjdk-11-jdk

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Initialize OrangeFox Manifest
        run: |
          mkdir -p ~/orangefox
          cd ~/orangefox
          git config --global user.name "theilgar"
          git config --global user.email "theilgar@users.noreply.github.com"
          repo init --depth=1 -u https://gitlab.com/OrangeFox/manifest.git -b ${{ env.FOX_BRANCH }}
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Link Device Tree
        run: |
          mkdir -p ~/orangefox/device/${{ env.BRAND }}/${{ env.DEVICE }}
          cp -r ${GITHUB_WORKSPACE}/device/${{ env.BRAND }}/${{ env.DEVICE }}/* ~/orangefox/device/${{ env.BRAND }}/${{ env.DEVICE }}/

      - name: Compile OrangeFox Recovery
        run: |
          cd ~/orangefox
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
          export LC_ALL="C"
          lunch omni_${{ env.DEVICE }}-eng
          mka recoveryimage vendorbootimage -j$(nproc --all)

      - name: Prepare Artifacts
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/out_artifacts
          cd ~/orangefox/out/target/product/${{ env.DEVICE }}
          find . -maxdepth 2 -name "OrangeFox*.zip" -exec cp {} ${GITHUB_WORKSPACE}/out_artifacts/ \; || true
          find . -maxdepth 2 -name "OrangeFox*.img" -exec cp {} ${GITHUB_WORKSPACE}/out_artifacts/ \; || true
          find . -maxdepth 1 -name "recovery.img" -exec cp {} ${GITHUB_WORKSPACE}/out_artifacts/ \; || true
          find . -maxdepth 1 -name "vendor_boot.img" -exec cp {} ${GITHUB_WORKSPACE}/out_artifacts/ \; || true
          cd ${GITHUB_WORKSPACE}/out_artifacts
          ls -la

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-Recovery-${{ env.DEVICE }}
          path: out_artifacts/*
