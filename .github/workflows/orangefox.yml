name: Build OrangeFox Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - fox_12.1
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build OrangeFox Recovery
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: device/xiaomi/emerald
          fetch-depth: 0

      - name: Checkout Kernel Prebuilts (LineageOS 24.0)
        uses: actions/checkout@v4
        with:
          repository: theilgar/device_xiaomi_emerald-kernel
          ref: lineage-24.0
          path: device/xiaomi/emerald-kernel

      - name: Checkout Vendor Blobs (LineageOS 24.0)
        uses: actions/checkout@v4
        with:
          repository: theilgar/vendor_xiaomi_emerald
          ref: lineage-24.0
          path: vendor/xiaomi/emerald

      - name: Synchronize Prebuilts from LineageOS Trees
        run: |
          chmod +x ${GITHUB_WORKSPACE}/device/xiaomi/emerald/scripts/sync_from_lineage.sh
          bash ${GITHUB_WORKSPACE}/device/xiaomi/emerald/scripts/sync_from_lineage.sh

      - name: Cleanup Host Disk Space
        run: |
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/lib/jvm /opt/ghc /var/lib/docker
          sudo rm -rf /usr/local/share/boost /usr/local/share/powershell
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg \
            gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 \
            libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop patch pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3 openjdk-11-jdk

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo
          sudo ln -sf ~/bin/repo /usr/local/bin/repo

      - name: Initialize and Sync OrangeFox Sources
        run: |
          git config --global user.name "theilgar"
          git config --global user.email "129194325+theilgar@users.noreply.github.com"
          git config --global --add safe.directory "*"
          git clone https://gitlab.com/OrangeFox/sync.git ~/fox_sync
          cd ~/fox_sync
          ./orangefox_sync.sh --branch 12.1 --path ~/orangefox

      - name: Link Device Tree
        run: |
          mkdir -p ~/orangefox/device/xiaomi
          rm -rf ~/orangefox/device/xiaomi/emerald
          cp -a ${GITHUB_WORKSPACE}/device/xiaomi/emerald ~/orangefox/device/xiaomi/
          ls -la ~/orangefox/device/xiaomi/emerald/

      - name: Update mkbootimg for Boot Header v4
        run: |
          mkdir -p ~/orangefox/system/tools/mkbootimg
          cp -f ${GITHUB_WORKSPACE}/device/xiaomi/emerald/prebuilt/mkbootimg.py ~/orangefox/system/tools/mkbootimg/mkbootimg.py
          cp -f ${GITHUB_WORKSPACE}/device/xiaomi/emerald/prebuilt/unpack_bootimg.py ~/orangefox/system/tools/mkbootimg/unpack_bootimg.py

      - name: Compile OrangeFox Recovery
        shell: bash --noprofile --norc {0}
        run: |
          set +e
          exec > >(tee -a /tmp/build.log) 2>&1
          set -x
          cd ~/orangefox
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_TYPE="Alpha"
          export FOX_BUILD_DEVICE="emerald"
          export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
          export FOX_VENDOR_BOOT_RECOVERY=1
          export LC_ALL="C"
          source build/envsetup.sh

          echo "=== DUMPING PRODUCTS LIST ==="
          build/soong/soong_ui.bash --dumpvar-mode COMMON_LUNCH_CHOICES || true

          echo "=== RUNNING LUNCH ==="
          lunch twrp_emerald-eng || lunch omni_emerald-eng || lunch twrp_emerald-userdebug
          LUNCH_STATUS=$?
          echo "=== Lunch result code: ${LUNCH_STATUS} ==="
          if [ ${LUNCH_STATUS} -ne 0 ]; then
            echo "ERROR: Lunch command failed to configure product."
            cat out/error.log 2>/dev/null || true
            exit 1
          fi

          echo "=== STARTING COMPILATION ==="
          mka adbd vendorbootimage recoveryimage -j$(nproc --all)
          BUILD_STATUS=$?
          echo "=== Build return code: ${BUILD_STATUS} ==="
          if [ ${BUILD_STATUS} -ne 0 ]; then
            echo "ERROR: Compilation failed."
            exit ${BUILD_STATUS}
          fi

      - name: Prepare Artifacts
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/out_artifacts
          cd ~/orangefox/out/target/product/emerald
          find . -maxdepth 2 -name "OrangeFox*.zip" -exec cp {} ${GITHUB_WORKSPACE}/out_artifacts/ \; || true

          # Find compiled recovery ramdisk
          RECOVERY_RAMDISK=$(find ~/orangefox/out/target/product/emerald -name "recovery.cpio*" | head -n 1)
          echo "Using recovery ramdisk: ${RECOVERY_RAMDISK}"

          # Ensure recovery ramdisk fragment is compressed with legacy LZ4 (magic 0x184c2102) required by MediaTek MT6789 GKI kernel
          mkdir -p /tmp/rec_repack
          if [[ "${RECOVERY_RAMDISK}" == *.gz ]]; then
            gzip -dc "${RECOVERY_RAMDISK}" > /tmp/rec_repack/recovery.cpio
          elif [[ "${RECOVERY_RAMDISK}" == *.lz4 ]]; then
            lz4 -dc "${RECOVERY_RAMDISK}" > /tmp/rec_repack/recovery.cpio
          else
            cp "${RECOVERY_RAMDISK}" /tmp/rec_repack/recovery.cpio
          fi
          lz4 -9 -l /tmp/rec_repack/recovery.cpio ${GITHUB_WORKSPACE}/recovery_fragment.cpio.lz4

          # Assemble complete hybrid vendor_boot.img (Platform Ramdisk + OrangeFox Recovery + MT6789 DTB + Bootconfig)
          python3 ${GITHUB_WORKSPACE}/device/xiaomi/emerald/prebuilt/mkbootimg.py \
            --header_version 4 \
            --pagesize 0x00001000 \
            --base 0x00000000 \
            --kernel_offset 0x40000000 \
            --ramdisk_offset 0x66f00000 \
            --tags_offset 0x47c80000 \
            --dtb_offset 0x0000000047c80000 \
            --vendor_cmdline 'bootopt=64S3,32N2,64N2 bootconfig androidboot.selinux=permissive' \
            --board '' \
            --dtb ${GITHUB_WORKSPACE}/device/xiaomi/emerald/prebuilt/dtb.img \
            --vendor_bootconfig ${GITHUB_WORKSPACE}/device/xiaomi/emerald/prebuilt/bootconfig \
            --ramdisk_type 1 \
            --ramdisk_name '' \
            --vendor_ramdisk_fragment ${GITHUB_WORKSPACE}/device/xiaomi/emerald/prebuilt/platform_ramdisk.cpio.lz4 \
            --ramdisk_type 2 \
            --ramdisk_name recovery \
            --vendor_ramdisk_fragment ${GITHUB_WORKSPACE}/recovery_fragment.cpio.lz4 \
            --vendor_boot ${GITHUB_WORKSPACE}/out_artifacts/vendor_boot.img

          cp ${GITHUB_WORKSPACE}/out_artifacts/vendor_boot.img ${GITHUB_WORKSPACE}/out_artifacts/recovery.img

          # Also create 64MB padded version matching physical partition size
          cp ${GITHUB_WORKSPACE}/out_artifacts/vendor_boot.img ${GITHUB_WORKSPACE}/out_artifacts/vendor_boot_64mb.img
          truncate -s 67108864 ${GITHUB_WORKSPACE}/out_artifacts/vendor_boot_64mb.img

          cd ${GITHUB_WORKSPACE}/out_artifacts
          ls -lh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-Recovery-emerald
          path: out_artifacts/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: recovery-build-${{ github.run_number }}
          name: OrangeFox Recovery for Redmi Note 13 Pro 4G (${{ github.run_number }})
          draft: false
          prerelease: false
          files: out_artifacts/*

      - name: Push failure log to git
        if: failure()
        run: |
          cd ${GITHUB_WORKSPACE}/device/xiaomi/emerald
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-log
          cp /tmp/build.log ./build_error.log
          git add build_error.log
          git commit -m "ci: Dump build error log [skip ci]" || true
          git push -f origin build-log || true
