name: Build OrangeFox Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - fox_12.1
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build OrangeFox Recovery
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: device/xiaomi/emerald

      - name: Cleanup Host Disk Space
        run: |
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/lib/jvm /opt/ghc /var/lib/docker
          sudo rm -rf /usr/local/share/boost /usr/local/share/powershell
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg \
            gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 \
            libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop patch pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3 openjdk-11-jdk

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo
          sudo ln -sf ~/bin/repo /usr/local/bin/repo

      - name: Initialize and Sync OrangeFox Sources
        run: |
          git config --global user.name "theilgar"
          git config --global user.email "129194325+theilgar@users.noreply.github.com"
          git config --global --add safe.directory "*"
          git clone https://gitlab.com/OrangeFox/sync.git ~/fox_sync
          cd ~/fox_sync
          ./orangefox_sync.sh --branch 12.1 --path ~/orangefox

      - name: Link Device Tree
        run: |
          mkdir -p ~/orangefox/device/xiaomi/emerald
          cp -r ${GITHUB_WORKSPACE}/device/xiaomi/emerald/* ~/orangefox/device/xiaomi/emerald/
          ls -la ~/orangefox/device/xiaomi/emerald/

      - name: Compile OrangeFox Recovery
        run: |
          cd ~/orangefox
          set +e
          source build/envsetup.sh
          echo "=== Running lunch for emerald ==="
          lunch twrp_emerald-eng || lunch omni_emerald-eng || lunch twrp_emerald-userdebug
          LUNCH_STATUS=$?
          echo "=== Lunch return code: ${LUNCH_STATUS} ==="
          if [ ${LUNCH_STATUS} -ne 0 ]; then
            echo "ERROR: Lunch command failed to configure product."
            exit 1
          fi
          set -e
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
          export FOX_VENDOR_BOOT_RECOVERY=1
          export OF_VENDOR_BOOT_RECOVERY=1
          export LC_ALL="C"
          mka vendorbootimage -j$(nproc --all) || mka recoveryimage -j$(nproc --all)

      - name: Prepare Artifacts
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/out_artifacts
          cd ~/orangefox/out/target/product/emerald
          find . -maxdepth 2 -name "OrangeFox*.zip" -exec cp {} ${GITHUB_WORKSPACE}/out_artifacts/ \; || true
          find . -maxdepth 2 -name "OrangeFox*.img" -exec cp {} ${GITHUB_WORKSPACE}/out_artifacts/ \; || true
          find . -maxdepth 1 -name "vendor_boot.img" -exec cp {} ${GITHUB_WORKSPACE}/out_artifacts/ \; || true
          find . -maxdepth 1 -name "recovery.img" -exec cp {} ${GITHUB_WORKSPACE}/out_artifacts/ \; || true
          cd ${GITHUB_WORKSPACE}/out_artifacts
          ls -la

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-Recovery-emerald
          path: out_artifacts/*

      - name: Debug Output on Failure
        if: failure()
        run: |
          echo "=== Files in device tree ==="
          ls -la ~/orangefox/device/xiaomi/emerald || true
          echo "=== Out directory contents ==="
          ls -la ~/orangefox/out/target/product/emerald || true
          echo "=== Tail of build log files ==="
          find ~/orangefox/out -name "*.log" -exec tail -n 100 {} + || true
